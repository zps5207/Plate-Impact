[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embmesh"
version = "0.1.0"
description = "Embedded-fiber mesher for Abaqus decks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.scripts]
embmesh = "embmesh.cli:main"

[tool.setuptools.packages.find]
include = ["embmesh*"]

